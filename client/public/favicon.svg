<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Sleek Dark Rounded Capsule Background -->
  <rect width="64" height="64" rx="16" fill="#070b14"/>
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="url(#borderGrad)" stroke-width="1.5" stroke-opacity="0.8"/>
  
  <!-- "VM" Bold Monogram -->
  <text 
    x="32" 
    y="43" 
    text-anchor="middle" 
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
    font-size="29" 
    font-weight="900" 
    letter-spacing="-1.2px"
    fill="url(#vmGrad)"
  >VM</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="vmGrad" x1="12" y1="16" x2="52" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
</svg>
